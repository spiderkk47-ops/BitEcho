name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Build Go module (gomobile)
        run: |
          cd go
          go mod init github.com/bitecho/go || true
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          gomobile bind -target=android -o build/BitEcho.aar -androidapi=26 github.com/bitecho/go
          cd ..
          mkdir -p app/libs
          cp go/build/BitEcho.aar app/libs/ || echo "AAR not found, continuing"
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build APK
        run: ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitEcho-App
          path: app/build/outputs/apk/debug/*.apk
